name: Markety Server CI
on:
  pull_request:
    branches: [main, master, dev]
  push:
    branches: [dev]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x]
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: yarn install
      - name: Test
        run: yarn run test
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x]
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: yarn install
      - name: Build
        run: yarn run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: jocanola/markety-server:latest
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: Set permissions for private key
        run: |
          echo "${{secrets.AWS_PRIVATE_KEY}}" > key.pem
          chmod 600 key.pem
      - name: Pull Docker image
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@ec2-54-162-109-225.compute-1.amazonaws.com 'sudo yum install docker -y'
          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@ec2-54-162-109-225.compute-1.amazonaws.com 'sudo service docker start'
          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@ec2-54-162-109-225.compute-1.amazonaws.com 'sudo docker pull jocanola/markety-server:latest'
      - name: Stop running container
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@ec2-54-162-109-225.compute-1.amazonaws.com 'sudo docker stop markety-server || true'
          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@ec2-54-162-109-225.compute-1.amazonaws.com 'sudo docker rm markety-server || true'
      - name: Run new container
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@ec2-54-162-109-225.compute-1.amazonaws.com 'sudo docker run -it -p 3333:3333 jocanola/markety-server:latest'
